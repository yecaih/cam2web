[package]
name = "cam2web"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"

[dependencies]
anyhow = "1"
axum = "0.8"
futures-util = "0.3"
image = { version = "0.25", default-features = false, features = ["jpeg"] }
libc = "0.2"
linux-raw-sys = { version = "0.12.1", features = ["ioctl"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
toml = "0.8"
