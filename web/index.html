<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#f5f7f9">
  <title>cam2web · 相机调试台</title>
  <link rel="stylesheet" href="/assets/cam2web.css">
</head>
<body>
  <main>
    <header class="appbar panel" aria-label="设备与预览">
      <div class="brand">
        <svg class="brand-mark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
          <rect x="3" y="7" width="18" height="13" rx="3.2"/>
          <circle cx="12" cy="13.4" r="3.4"/>
          <path d="M8.6 7 10 4.6h4L15.4 7"/>
        </svg>
        <h1>cam2web</h1>
        <span class="brand-tagline">相机调试台</span>
      </div>
      <div class="device">
        <select id="camera" aria-label="采集节点" disabled><option value="">选择采集节点</option></select>
        <button type="button" id="preview-toggle" data-action="start" disabled>启动预览</button>
      </div>
      <div class="statuses" role="status">
        <span id="board" class="badge">板端：连接中</span>
        <span id="viewer" class="badge">本页：未订阅</span>
      </div>
      <p id="operation" class="error" role="alert"></p>
    </header>

    <div class="workbench">
      <section class="preview panel" aria-labelledby="preview-title">
        <header class="panel-heading">
          <h2 id="preview-title">图像预览</h2>
          <span class="panel-hint">实时 MJPEG</span>
        </header>
        <div class="viewport">
          <img id="frame" alt="实时相机预览" hidden>
          <span id="preview-metrics" class="overlay-chip"></span>
          <p id="empty-frame" role="status">预览未启动</p>
        </div>
      </section>

      <section class="metadata panel" aria-labelledby="metadata-title">
        <h2 id="metadata-title">Metadata</h2>
        <div class="metadata-values small">
          <span id="metadata-empty">—</span>
          <span id="metadata-depth" hidden></span>
          <span id="metadata-nir" hidden></span>
        </div>
        <details id="metadata-details" hidden>
          <summary>原始字段</summary>
          <code id="metadata-depth-raw"></code>
          <code id="metadata-nir-raw"></code>
        </details>
      </section>

      <div class="commands">
        <details class="command-group panel" open>
          <summary id="controls-title" class="panel-heading">用户命令</summary>
          <div id="controls" class="entries" role="region" aria-labelledby="controls-title" tabindex="0">
            <p class="small" id="controls-note" role="status"></p>
            <div id="control-rows"></div>
          </div>
        </details>
        <details class="command-group panel">
          <summary id="camera-controls-title" class="panel-heading">相机命令</summary>
          <div id="camera-controls" class="entries" role="region" aria-labelledby="camera-controls-title" tabindex="0">
            <p class="small" id="camera-controls-note" role="status"></p>
            <div id="camera-control-rows"></div>
          </div>
        </details>
      </div>
    </div>
  </main>
  <script src="/assets/cam2web.js" defer></script>
</body>
</html>
